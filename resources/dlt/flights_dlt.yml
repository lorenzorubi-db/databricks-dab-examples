resources:
  pipelines:
    flights_dlt:
      name: flights-gen-bundle_dlt_${bundle.target}
      configuration:
        var.source_path: /databricks-datasets/airlines
        
        artifact_path: ${workspace.file_path}/src
        
      libraries:
        - notebook:
            path: ../../src/flights_main_dlt.py
      target: ${var.flights_dlt_schema}
      development: false
      catalog: ${var.catalog}
      
      serverless: true
      

  jobs:
    flights_dlt_job:
      name: flights-gen-bundle_dlt_job_${bundle.target}

      tasks:
        - task_key: run_flights_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.flights_dlt.id}
          max_retries: 0