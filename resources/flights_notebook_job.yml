# The main job for flights-gen-bundle.
resources:
  jobs:
    flights_notebook:
      name: flights-gen-bundle_job_${bundle.target}

      tasks:
        - task_key: notebook_task
          notebook_task:
            notebook_path: ../src/flights_main_notebook.py
            base_parameters:
                catalog: ${var.catalog}
                database: ${var.database}
                
          max_retries: 0

